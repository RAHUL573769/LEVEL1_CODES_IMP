<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>

  <button onclick="makeYellow()">Make Yellow</button>
  <button id="make-blue">Make Blue</button>
  <button id="make-purple">Make Purple</button>

  <h1 >Integrate Innner Html with AddEventListener</h1>
  <h1 id="title">Event Handler</h1>
<button id="update-title">Update Title</button>
  <!-- Different Ways to add AddEventListener -->
   <input id="input" type="text" value="" >
   <button id="update-text">Update</button>
    <button id="make-green">Make Green</button>

  <script>
    function makeYellow() {
      document.body.style.backgroundColor = "yellow";
    }

    const blueButtonId = document.getElementById("make-blue");

    blueButtonId.onclick = function () {
      document.body.style.backgroundColor = "blue";
    };
    document.getElementById("make-green").addEventListener("click",()=>{
          document.body.style.backgroundColor = "green";
    })
  </script>
<script src="./index.js" defer></script>
</body>
</html>
