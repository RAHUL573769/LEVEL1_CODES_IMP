<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Document</title>
</head>
<body class="bg-slate-600">

<section class="max-w-md min-h-screen mx-auto py-6 bg-gray-200">

<header>
    <nav>
        <div class="">
            <img src="./payoo-resources/assets/opt-1.png" alt="" srcset="">

        <img src="./payoo-resources/assets/Logo-full.png" alt="" srcset="">
        </div>
    </nav>
</header>

<section>
    <div class="hero bg-base-200 min-h-screen h-full">
  <div class="hero-content flex-col lg:flex-row-reverse">

    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label">Account Number</label>
          <input id="account-number" type="number" class="input" placeholder="number" required />
          <label class="label">Password</label>
          <input  id="account-pin" type="password" class="input" placeholder="Password" required/>
          <div><a class="link link-hover">Forgot password?</a></div>
          <button id="login-btn" class="btn btn-neutral mt-4">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
</section>
</section>

<script src="./script.js"></script>
</body>
</html>
